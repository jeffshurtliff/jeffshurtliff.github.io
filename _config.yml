    Exploring Director and Senior Manager roles in Business Applications,
    Enterprise Applications, CRM, Salesforce, and Customer Experience Technology.
  cta_label: Start a conversation
  cta_url: mailto:jeff@shurt.us

remote_theme: yaoyao-liu/minimal-light@1ea07f39518ac44644406380c83da6f89037c4fc
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

permalink: /blog/:year/:month/:day/:title/
feed:
  path: feed.xml

sass:
  style: compressed

kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - AGENTS.md
  - CONTENT-LICENSE.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - PLAN.md
  - README.md
  - local
  - scripts
  - tmp
  - vendor
