title: Jeff Shurtliff, CISSP
tagline: Enterprise Business Applications Leader
description: >-
  Enterprise business applications leader combining global people leadership,
  Salesforce platform strategy, secure architecture, and hands-on Python engineering.
url: "https://jeffshurtliff.github.io"
baseurl: ""
lang: en-US
locale: en_US
timezone: America/Denver
repository: jeffshurtliff/jeffshurtliff.github.io

author:
  name: Jeff Shurtliff
  email: jeff@shurt.us
  location: Orem, Utah, USA

position: Enterprise Business Applications Leader
email: jeff@shurt.us
avatar: /assets/img/avatar.png
avatar_small: /assets/img/avatar-192.png
avatar_medium: /assets/img/avatar-384.png
avatar_small_webp: /assets/img/avatar-192.webp
avatar_medium_webp: /assets/img/avatar-384.webp
logo: /assets/img/avatar.png
image: /assets/img/social-preview.png
resume_path: /assets/files/Jeff-Shurtliff-Resume-2026.pdf

availability:
  enabled: true
  label: Open to new opportunities
