---
layout: default
---
<article class="page">
  <header class="page-header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</article>
